<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — session terminal</title>
  <meta name="description" content="Portfolio d'un développeur web freelance présenté comme une session de terminal : parcours, compétences, missions, projets et contact.">
  <meta name="theme-color" content="#0c0f0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==================================================================
       02 — TERMINAL · session shell plein écran
       ================================================================== */
    :root {
      --bg:        #0c0f0c;
      --bg-deep:   #070907;
      --bg-raise:  #10140f;
      --bg-card:   #0e120e;
      --border:    #232b23;
      --txt:       #e6e6e6;
      --bright:    #ffffff;
      --dim:       #9aa49b;
      --green:     #33d17a;
      --amber:     #ffb000;
      --blue:      #7aa2f7;
      --dot-red:   #ff5f56;
      --dot-yellow:#ffbd2e;
      --dot-green: #27c93f;
      --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo,
              Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #263026 var(--bg-deep);
    }

    body {
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(0.88rem, 0.84rem + 0.25vw, 1rem);
      line-height: 1.7;
      color: var(--txt);
      background: var(--bg-deep);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--green); color: #06130b; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb {
      background: #263026;
      border-radius: 6px;
      border: 2px solid var(--bg-deep);
    }
    ::-webkit-scrollbar-thumb:hover { background: #354235; }

    a { color: var(--amber); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: #ffc94d; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 2px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .skip-link {
      position: absolute; left: 1rem; top: -4rem; z-index: 50;
      background: var(--green); color: #06130b;
      padding: .5rem 1rem; border-radius: 4px;
      font-weight: 700; text-decoration: none;
      transition: top .15s ease;
    }
    .skip-link:focus { top: 1rem; }

    /* ---------- fenêtre de terminal ---------- */
    .term {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1100px 700px at 75% -10%, #111811 0%, var(--bg) 60%),
        var(--bg);
    }

    .titlebar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 1rem;
      padding: .65rem 1.1rem;
      background: rgba(16, 20, 15, .92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .dots { display: flex; gap: .5rem; flex: 0 0 auto; }
    .dot { width: .75rem; height: .75rem; border-radius: 50%; }
    .dot-r { background: var(--dot-red); }
    .dot-y { background: var(--dot-yellow); }
    .dot-g { background: var(--dot-green); }
    .win-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      color: var(--dim); font-size: .85em; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 55%;
    }
    .win-mode { margin-left: auto; color: #5c665c; font-size: .78em; }
    @media (max-width: 560px) { .win-mode { display: none; } }

    .screen {
      width: 100%;
      max-width: 60rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2.5rem) 4rem;
      flex: 1;
    }

    .boot { color: var(--dim); }

    /* ---------- lignes de commande ---------- */
    .shell-block { margin: 0 0 clamp(2.6rem, 6vw, 4rem); }
    .shell-block:first-child { margin-top: clamp(.5rem, 3vw, 2rem); }

    .cmd {
      font-weight: 500;
      color: var(--bright);
      word-break: break-word;
    }
    .ps1 { font-weight: 700; }
    .ps1-user { color: var(--green); }
    .ps1-sep, .ps1-dollar { color: var(--dim); font-weight: 400; }
    .ps1-path { color: var(--blue); }
    .ps1-dollar { margin-left: .35ch; color: var(--green); }

    .type-caret {
      display: none;
      width: .62ch; height: 1.05em;
      margin-left: .15ch;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1.05s steps(2, start) infinite;
    }
    .shell-block.pending .type-caret,
    .shell-block.typing  .type-caret { display: inline-block; }

    @keyframes blink { 50% { opacity: 0; } }

    .out { margin-top: 1rem; transition: opacity .3s ease; }
    .shell-block.pending .out { opacity: 0; }

    .comment, .dim { color: var(--dim); }
    .comment { font-size: .92em; }

    /* ---------- hero ---------- */
    .hero-name {
      margin: .2rem 0 0;
      font-size: clamp(1.7rem, 6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--bright);
      line-height: 1.15;
    }
    .hero-title {
      margin: .35rem 0 0;
      font-size: clamp(1.02rem, 2.5vw, 1.25rem);
      color: var(--green);
      font-weight: 500;
    }
    .hero-tagline {
      margin: 1.1rem 0 0;
      max-width: 46ch;
      color: var(--txt);
    }
    .hero-meta {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: .5rem 1rem;
      margin: 1.4rem 0 0;
      color: var(--dim);
      font-size: .92em;
    }
    .avail {
      display: inline-flex; align-items: center; gap: .55ch;
      color: var(--green);
      border: 1px solid #1f4630;
      background: #0f1a12;
      border-radius: 999px;
      padding: .18em .85em;
      font-weight: 500;
    }
    .avail .pulse {
      width: .55em; height: .55em; border-radius: 50%;
      background: var(--green);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
    .hero-meta .sep { color: #4a544a; }

    /* ---------- sortie markdown ---------- */
    .doc p { margin: .8em 0; }
    .doc p:first-child { margin-top: .2em; }
    .doc h1, .doc h2, .doc h3, .doc h4 {
      color: var(--bright); line-height: 1.3;
      margin: 1.4em 0 .5em; font-size: 1.05em;
    }
    .doc ul, .doc ol { margin: .8em 0; padding-left: 1.6em; }
    .doc ul { list-style: none; }
    .doc ul li { position: relative; margin: .35em 0; }
    .doc ul li::before {
      content: "–"; position: absolute; left: -1.35em;
      color: var(--green);
    }
    .doc ol li { margin: .35em 0; }
    .doc code {
      background: #1a211a; color: #ffd98a;
      padding: .1em .4em; border-radius: 4px;
      font-size: .92em;
    }
    .doc pre {
      background: var(--bg-raise); border: 1px solid var(--border);
      border-radius: 6px; padding: 1rem; overflow-x: auto;
    }
    .doc pre code { background: none; padding: 0; color: var(--txt); }
    .doc blockquote {
      margin: 1em 0; padding: .2em 1.2em;
      border-left: 3px solid var(--green); color: var(--dim);
    }
    .doc hr { border: 0; border-top: 1px dashed var(--border); margin: 1.5em 0; }
    .doc img { max-width: 100%; height: auto; border-radius: 6px; }
    .doc strong { color: var(--bright); }

    /* ---------- compétences ---------- */
    .skills {
      display: flex; flex-wrap: wrap;
      gap: .6rem .75rem;
      list-style: none; margin: 0; padding: 0;
    }
    .skill {
      background: var(--bg-raise);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: .3em .85em;
      color: var(--txt);
      font-weight: 500;
    }
    .skill .slash { color: var(--green); margin-left: .1ch; }

    /* ---------- expériences (journal) ---------- */
    .log-entry {
      border-left: 2px solid #24402e;
      padding: .1rem 0 .35rem clamp(.9rem, 3vw, 1.4rem);
      margin: 0 0 2.4rem;
    }
    .log-entry:last-child { margin-bottom: .5rem; }
    .log-head {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: .25rem .8rem;
    }
    .log-period { color: var(--txt); font-weight: 700; white-space: nowrap; }
    .log-period .brk { color: #566056; font-weight: 400; }
    .log-title {
      margin: 0; font-size: 1.06em; font-weight: 700;
      color: var(--bright); display: inline;
    }
    .log-org, .log-loc { color: var(--dim); }
    .log-summary { margin: .7rem 0 0; color: var(--dim); font-style: italic; }
    .log-entry .doc { margin-top: .3rem; }

    .tags {
      display: flex; flex-wrap: wrap; gap: .3rem 1.1rem;
      list-style: none; margin: 1rem 0 0; padding: 0;
      font-size: .9em;
    }
    .tags li { color: var(--dim); }
    .tags li::before { content: "#"; color: #5c665c; }

    /* ---------- projets ---------- */
    .proj {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 3.5vw, 1.75rem);
      margin: 0 0 1.4rem;
    }
    .proj-head {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: .25rem .9rem;
    }
    .proj-name {
      margin: 0; display: inline;
      font-size: 1.08em; font-weight: 700; color: var(--bright);
    }
    .proj-name .slash { color: var(--green); }
    .status { font-weight: 700; white-space: nowrap; }
    .st-actif   { color: var(--green); }
    .st-pause   { color: var(--amber); }
    .st-archive { color: var(--dim); }
    .proj-period { color: var(--dim); font-size: .92em; margin-left: auto; }
    @media (max-width: 480px) { .proj-period { margin-left: 0; } }
    .proj-summary { margin: .75rem 0 0; color: var(--dim); font-style: italic; }
    .proj .doc { margin-top: .3rem; }
    .proj-links {
      display: flex; flex-wrap: wrap; gap: .5rem 1.6rem;
      margin: 1rem 0 0;
    }
    .proj-links a { font-weight: 500; }

    /* ---------- contact ---------- */
    .contact-list {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .55rem 2rem;
      margin: 0;
    }
    .contact-list dt { color: var(--dim); }
    .contact-list dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 420px) {
      .contact-list { grid-template-columns: 1fr; gap: .1rem; }
      .contact-list dd { margin-bottom: .7rem; }
    }
    .contact-hint { margin: 1.4rem 0 0; color: var(--dim); font-size: .92em; }

    /* ---------- terminal interactif ---------- */
    .interactive {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-raise);
      padding: clamp(1rem, 3vw, 1.6rem) clamp(1rem, 3.5vw, 1.8rem);
    }
    .interactive .out { margin-top: .9rem; }

    .help {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .3rem 1.6rem;
      align-items: baseline;
    }
    @media (max-width: 420px) { .help { grid-template-columns: max-content 1fr; gap: .3rem 1rem; } }
    .help .desc { color: var(--dim); }

    .hcmd {
      font: inherit; font-weight: 500;
      color: var(--amber);
      background: none; border: none; padding: 0;
      cursor: pointer; text-align: left;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }
    .hcmd:hover { text-decoration-style: solid; color: #ffc94d; }

    .term-log .exec { margin-top: 1.2rem; }
    .term-log .exec .out { margin-top: .5rem; }
    .mini { list-style: none; margin: .2em 0; padding: 0; }
    .mini li { margin: .3em 0; }
    .ls-row { display: flex; flex-wrap: wrap; gap: .4rem 2rem; margin: .2em 0; }

    .prompt-line {
      display: flex; align-items: baseline; gap: .6ch;
      margin-top: 1.3rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
    }
    .input-wrap { position: relative; flex: 1; display: flex; }
    .term-input {
      font: inherit; font-weight: 500;
      color: var(--bright);
      background: transparent;
      border: none; outline: none;
      caret-color: var(--green);
      width: 100%;
      padding: 0;
    }
    .stand-caret {
      display: none;
      position: absolute; left: 0; top: .12em;
      width: .62ch; height: 1.05em;
      background: var(--green);
      animation: blink 1.05s steps(2, start) infinite;
      pointer-events: none;
    }
    .term-input:placeholder-shown ~ .stand-caret { display: block; }

    /* ---------- pied de page ---------- */
    .site-foot {
      max-width: 60rem;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2.5rem) 2.2rem;
      color: #5c665c;
      font-size: .85em;
    }

    /* ---------- accessibilité / divers ---------- */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .shell-block.pending .out { opacity: 1; }
    }

    @media print {
      .shell-block .out { opacity: 1 !important; }
      body, .term { background: #fff; color: #000; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <div class="term">
    <header class="titlebar">
      <div class="dots" aria-hidden="true">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
      </div>
      <span class="win-title" id="win-title">portfolio: ~</span>
      <span class="win-mode" aria-hidden="true">bash · utf-8</span>
    </header>

    <main class="screen" id="contenu" tabindex="-1">
      <p class="boot">ouverture de la session…</p>
    </main>

    <footer class="site-foot" id="pied"></footer>
  </div>

  <noscript>
    <p style="font-family:monospace;padding:2rem">
      Ce site charge son contenu en JavaScript — merci de l'activer pour consulter le portfolio.
    </p>
  </noscript>

  <script>
    'use strict';

    function initSite(data) {
      var profile = data.profile;
      var p = profile.meta || {};
      var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---------------- utilitaires ---------------- */
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function deaccent(s) {
        return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      }
      function slug(s) {
        return deaccent(String(s).toLowerCase())
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sans-nom';
      }
      function shortUrl(u) {
        return String(u).replace(/^https?:\/\//, '').replace(/\/$/, '');
      }

      var firstName = p.name ? slug(p.name.trim().split(/\s+/)[0]) : 'invite';
      var HOST = firstName + '@freelance';
      var PS1 =
        '<span class="ps1"><span class="ps1-user">' + esc(HOST) + '</span>' +
        '<span class="ps1-sep">:</span><span class="ps1-path">~</span>' +
        '<span class="ps1-dollar">$</span></span>';

      function cmdLine(c) {
        return '<div class="cmd" aria-hidden="true">' + PS1 +
          ' <span class="cmd-text" data-cmd="' + esc(c) + '">' + esc(c) +
          '</span><span class="type-caret"></span></div>';
      }
      function section(id, label, cmd, out) {
        return '<section id="' + id + '" class="shell-block">' +
          (label ? '<h2 class="sr-only">' + esc(label) + '</h2>' : '') +
          cmdLine(cmd) + '<div class="out">' + out + '</div></section>';
      }
      function tagsHtml(tags) {
        if (!tags || !tags.length) return '';
        return '<ul class="tags">' +
          tags.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
          '</ul>';
      }

      /* ---------------- hero ---------------- */
      var heroOut = '<h1 class="hero-name">' + esc(p.name || 'Portfolio') + '</h1>';
      if (p.title) heroOut += '<p class="hero-title">' + esc(p.title) + '</p>';
      if (p.tagline) heroOut += '<p class="hero-tagline">' + esc(p.tagline) + '</p>';

      var metaBits = [];
      if (p.availability) {
        metaBits.push('<span class="avail"><span class="pulse" aria-hidden="true"></span>' +
          esc(p.availability) + '</span>');
      }
      if (p.location) metaBits.push('<span>' + esc(p.location) + '</span>');
      var y = parseInt(p.years, 10);
      if (!isNaN(y)) {
        metaBits.push('<span>' + y + (y > 1 ? ' ans' : ' an') + " d'expérience</span>");
      } else if (p.years) {
        metaBits.push('<span>' + esc(p.years) + '</span>');
      }
      if (metaBits.length) {
        heroOut += '<p class="hero-meta">' +
          metaBits.join('<span class="sep" aria-hidden="true">·</span>') + '</p>';
      }

      /* ---------------- à propos ---------------- */
      var aboutOut = '<div class="doc">' + (profile.html || '<p class="dim">(vide)</p>') + '</div>';

      /* ---------------- compétences ---------------- */
      var skillsOut;
      if (p.skills && p.skills.length) {
        skillsOut = '<ul class="skills">' + p.skills.map(function (s) {
          return '<li class="skill">' + esc(s) + '<span class="slash" aria-hidden="true">/</span></li>';
        }).join('') + '</ul>';
      } else {
        skillsOut = '<p class="dim">ls: competences/: répertoire vide</p>';
      }

      /* ---------------- expériences ---------------- */
      var xps = data.experiences || [];
      var xpOut = '<p class="comment"># ' + xps.length + ' entrée' + (xps.length > 1 ? 's' : '') +
        ' — de la plus récente à la plus ancienne</p>';
      xpOut += xps.map(function (d) {
        var m = d.meta || {};
        var h = '<header class="log-head">';
        if (m.period) {
          h += '<span class="log-period"><span class="brk">[</span>' + esc(m.period) +
            '<span class="brk">]</span></span>';
        }
        h += '<h3 class="log-title">' + esc(m.title || 'Mission') + '</h3>';
        if (m.org) h += '<span class="log-org">@ ' + esc(m.org) + '</span>';
        if (m.location) h += '<span class="log-loc">· ' + esc(m.location) + '</span>';
        h += '</header>';
        var b = '';
        if (m.summary) b += '<p class="log-summary">' + esc(m.summary) + '</p>';
        if (d.html) b += '<div class="doc">' + d.html + '</div>';
        b += tagsHtml(m.tags);
        return '<article class="log-entry">' + h + b + '</article>';
      }).join('');

      /* ---------------- projets ---------------- */
      var STATUS_CLASS = { 'actif': 'st-actif', 'en pause': 'st-pause', 'archivé': 'st-archive' };
      var projects = data.projects || [];
      var projOut = '<p class="comment">total ' + projects.length + '</p>';
      projOut += projects.map(function (d) {
        var m = d.meta || {};
        var h = '<header class="proj-head"><h3 class="proj-name">' + esc(slug(m.title || '')) +
          '<span class="slash" aria-hidden="true">/</span></h3>';
        if (m.status) {
          var cls = STATUS_CLASS[deaccent(m.status.toLowerCase())] ||
                    STATUS_CLASS[m.status.toLowerCase()] || 'st-archive';
          h += '<span class="status ' + cls + '">[' + esc(m.status) + ']</span>';
        }
        if (m.period) h += '<span class="proj-period">' + esc(m.period) + '</span>';
        h += '</header>';
        var b = '';
        if (m.summary) b += '<p class="proj-summary">' + esc(m.summary) + '</p>';
        if (d.html) b += '<div class="doc">' + d.html + '</div>';
        b += tagsHtml(m.tags);
        var links = [];
        if (m.repo) {
          links.push('<a href="' + esc(m.repo) + '" target="_blank" rel="noopener">→ code source</a>');
        }
        if (m.link) {
          links.push('<a href="' + esc(m.link) + '" target="_blank" rel="noopener">→ voir en ligne</a>');
        }
        if (links.length) b += '<p class="proj-links">' + links.join('') + '</p>';
        return '<article class="proj">' + h + b + '</article>';
      }).join('');

      /* ---------------- contact ---------------- */
      function contactHtml() {
        var rows = [];
        if (p.email) {
          rows.push(['email', '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>']);
        }
        if (p.github) {
          rows.push(['github', '<a href="' + esc(p.github) + '" target="_blank" rel="noopener">' +
            esc(shortUrl(p.github)) + '</a>']);
        }
        if (p.linkedin) {
          rows.push(['linkedin', '<a href="' + esc(p.linkedin) + '" target="_blank" rel="noopener">' +
            esc(shortUrl(p.linkedin)) + '</a>']);
        }
        if (p.location) rows.push(['lieu', esc(p.location)]);
        if (p.availability) rows.push(['statut', '<span class="st-actif">' + esc(p.availability) + '</span>']);
        if (!rows.length) return '<p class="dim">contact: aucune coordonnée renseignée</p>';
        return '<dl class="contact-list">' + rows.map(function (r) {
          return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
        }).join('') + '</dl>';
      }
      var contactOut = contactHtml() +
        '<p class="contact-hint"># réponse sous 24 h en semaine, devis gratuit</p>';

      /* ---------------- aide (section interactive) ---------------- */
      var HELP_ROWS = [
        ['whoami', "l'essentiel en une ligne"],
        ['a-propos', 'le parcours complet'],
        ['competences', 'la stack pratiquée'],
        ['experiences', 'le journal des missions'],
        ['projets', 'les projets en cours'],
        ['contact', 'me joindre'],
        ['clear', "effacer l'écran"],
        ['exit', 'fermer la session']
      ];
      function helpHtml() {
        return '<div class="help">' + HELP_ROWS.map(function (r) {
          return '<button type="button" class="hcmd" data-run="' + r[0] + '">' + r[0] +
            '</button><span class="desc">' + esc(r[1]) + '</span>';
        }).join('') + '</div>';
      }

      var interactiveSection =
        '<section id="interactif" class="shell-block interactive">' +
        '<h2 class="sr-only">Terminal interactif</h2>' +
        cmdLine('help') +
        '<div class="out">' + helpHtml() + '</div>' +
        '<div class="term-log" id="term-log" aria-live="polite"></div>' +
        '<form class="prompt-line" id="term-form">' +
        '<label class="sr-only" for="term-input">Tapez une commande puis validez avec Entrée</label>' +
        PS1 +
        '<span class="input-wrap">' +
        '<input class="term-input" id="term-input" type="text" placeholder=" " ' +
        'autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<span class="stand-caret" aria-hidden="true"></span>' +
        '</span></form>' +
        '</section>';

      /* ---------------- assemblage ---------------- */
      var main = document.getElementById('contenu');
      main.innerHTML =
        section('accueil', null, 'whoami', heroOut) +
        section('a-propos', 'À propos', 'cat a-propos.md', aboutOut) +
        section('competences', 'Compétences', 'ls competences/', skillsOut) +
        section('experiences', 'Expériences', 'cat journal-missions.log', xpOut) +
        section('projets', 'Projets', 'ls projets/ --details', projOut) +
        section('contact', 'Contact', 'contact --all', contactOut) +
        interactiveSection;

      document.getElementById('pied').innerHTML =
        '<p># fin de fichier — © ' + new Date().getFullYear() + ' ' + esc(p.name || '') +
        ' · fait main, sans framework</p>';

      if (p.name) {
        document.title = p.name + (p.title ? ' — ' + p.title : '');
      }
      document.getElementById('win-title').textContent = HOST + ': ~';

      /* ---------------- effet machine à écrire ---------------- */
      function setupTyping() {
        var blocks = Array.prototype.slice.call(document.querySelectorAll('.shell-block'));
        if (REDUCED || !('IntersectionObserver' in window)) {
          blocks.forEach(function (b) { b.classList.add('done'); });
          return;
        }
        var byCmd = new Map();
        blocks.forEach(function (b) {
          var t = b.querySelector('.cmd-text[data-cmd]');
          if (!t) { b.classList.add('done'); return; }
          t.textContent = '';
          b.classList.add('pending');
          byCmd.set(t, b);
        });
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (!en.isIntersecting) return;
            io.unobserve(en.target);
            typeBlock(byCmd.get(en.target), en.target);
          });
        }, { rootMargin: '2000px 0px -12% 0px', threshold: 0.1 });
        byCmd.forEach(function (b, t) { io.observe(t); });
      }
      function typeBlock(block, t) {
        var full = t.getAttribute('data-cmd');
        var i = 0;
        block.classList.add('typing');
        (function step() {
          i += 1;
          t.textContent = full.slice(0, i);
          if (i < full.length) {
            setTimeout(step, 14 + Math.random() * 26);
          } else {
            /* la sortie n'apparaît qu'une fois la commande entièrement tapée */
            block.classList.remove('typing', 'pending');
            block.classList.add('done');
          }
        })();
      }

      /* ---------------- prompt interactif ---------------- */
      function setupPrompt() {
        var form = document.getElementById('term-form');
        var input = document.getElementById('term-input');
        var log = document.getElementById('term-log');
        var history = [];
        var histIdx = -1;

        var miniXp = function () {
          if (!xps.length) return '<p class="dim">journal vide</p>';
          return '<ul class="mini">' + xps.map(function (d) {
            var m = d.meta || {};
            return '<li>' +
              (m.period ? '<span class="dim">[' + esc(m.period) + ']</span> ' : '') +
              '<strong>' + esc(m.title || 'Mission') + '</strong>' +
              (m.org ? ' <span class="dim">@ ' + esc(m.org) + '</span>' : '') +
              '</li>';
          }).join('') + '</ul>' +
            '<p class="dim">→ <a href="#experiences">détail complet plus haut</a></p>';
        };
        var miniProj = function () {
          if (!projects.length) return '<p class="dim">aucun projet</p>';
          return '<ul class="mini">' + projects.map(function (d) {
            var m = d.meta || {};
            var cls = m.status ? (STATUS_CLASS[deaccent(m.status.toLowerCase())] || 'st-archive') : '';
            return '<li><strong>' + esc(slug(m.title || '')) + '/</strong>' +
              (m.status ? ' <span class="status ' + cls + '">[' + esc(m.status) + ']</span>' : '') +
              (m.summary ? ' <span class="dim">— ' + esc(m.summary) + '</span>' : '') +
              '</li>';
          }).join('') + '</ul>' +
            '<p class="dim">→ <a href="#projets">détail complet plus haut</a></p>';
        };

        var COMMANDS = {
          'help': helpHtml,
          'whoami': function () {
            return '<p>' + esc(p.name || '?') +
              (p.title ? ' — ' + esc(p.title) : '') +
              (p.location ? ' <span class="dim">· ' + esc(p.location) + '</span>' : '') + '</p>';
          },
          'a-propos': function () { return '<div class="doc">' + (profile.html || '') + '</div>'; },
          'competences': function () { return skillsOut; },
          'experiences': miniXp,
          'projets': miniProj,
          'contact': contactHtml,
          'ls': function () {
            return '<p class="ls-row">' +
              '<a href="#a-propos">a-propos.md</a>' +
              '<a href="#competences">competences/</a>' +
              '<a href="#experiences">journal-missions.log</a>' +
              '<a href="#projets">projets/</a>' +
              '<a href="#contact">contact</a></p>';
          },
          'exit': function () {
            return '<p class="dim">logout<br>Session enregistrée — merci de votre visite. ' +
              "L'onglet reste à vous.</p>";
          }
        };
        var ALIAS = {
          '?': 'help', 'aide': 'help', 'skills': 'competences',
          'apropos': 'a-propos', 'about': 'a-propos', 'xp': 'experiences',
          'missions': 'experiences', 'projects': 'projets', 'mail': 'contact',
          'email': 'contact', 'cls': 'clear', 'quit': 'exit', 'logout': 'exit'
        };

        function run(raw) {
          var shown = raw.trim();
          var key = deaccent(shown.toLowerCase()).replace(/\s+/g, '-');
          key = ALIAS[key] || key;

          if (key === 'clear') { log.innerHTML = ''; return; }

          var out;
          if (!shown) {
            out = '';
          } else if (COMMANDS[key]) {
            out = COMMANDS[key]();
          } else {
            out = '<p>bash : ' + esc(shown) + ' : commande introuvable — essayez ' +
              '<button type="button" class="hcmd" data-run="help">help</button></p>';
          }
          var exec = document.createElement('div');
          exec.className = 'exec';
          exec.innerHTML =
            '<div class="cmd">' + PS1 + ' <span class="cmd-text">' + esc(shown) + '</span></div>' +
            (out ? '<div class="out">' + out + '</div>' : '');
          log.appendChild(exec);
          form.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = input.value;
          if (v.trim()) { history.push(v); }
          histIdx = history.length;
          input.value = '';
          run(v);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowUp') {
            if (histIdx > 0) { histIdx -= 1; input.value = history[histIdx]; }
            e.preventDefault();
          } else if (e.key === 'ArrowDown') {
            if (histIdx < history.length - 1) {
              histIdx += 1; input.value = history[histIdx];
            } else { histIdx = history.length; input.value = ''; }
            e.preventDefault();
          }
        });

        /* boutons "commande" cliquables (aide, erreurs) */
        document.addEventListener('click', function (e) {
          var btn = e.target.closest ? e.target.closest('[data-run]') : null;
          if (!btn) return;
          run(btn.getAttribute('data-run'));
          input.focus({ preventScroll: true });
        });

        /* cliquer dans la zone interactive donne le focus au prompt */
        document.getElementById('interactif').addEventListener('click', function (e) {
          if (e.target.closest('a, button, input')) return;
          input.focus({ preventScroll: true });
        });
      }

      setupTyping();
      setupPrompt();
    }
  </script>

  <script>
(async () => {
  let BASE = null;
  for (const b of ['./', '../../']) {
    try { const r = await fetch(b + 'content/manifest.json'); if (r.ok) { BASE = b; break; } } catch (e) {}
  }
  if (!BASE) {
    document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">Contenu introuvable — lancez ./serve.sh depuis la racine du dépôt (voir README).</p>';
    return;
  }
  const s = document.createElement('script');
  s.src = BASE + 'shared/portfolio.js';
  s.onload = async () => {
    try {
      const data = await window.PortfolioShared.loadPortfolio(BASE);
      initSite(data);
    } catch (e) {
      document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">Erreur de chargement du contenu : ' + e.message + '</p>';
    }
  };
  document.head.appendChild(s);
})();
  </script>
</body>
</html>
