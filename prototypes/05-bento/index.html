<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Développeur freelance</title>
<meta name="description" content="Portfolio d'un développeur web freelance : profil, compétences, expériences et projets open source.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BENTO DARK — reset & fondations
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.09);
    --card-border-hover: rgba(255, 255, 255, 0.20);
    --text: #ececf1;
    --text-2: #9a9aa5;
    --text-3: #6b6b78;
    --violet: #7c3aed;
    --cyan: #22d3ee;
    --green: #34d399;
    --amber: #fbbf24;
    --radius: 18px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Halos radiaux fixes, très subtils */
  body::before,
  body::after {
    content: '';
    position: fixed; z-index: -1; pointer-events: none; border-radius: 50%;
  }
  body::before {
    width: 60vw; height: 60vw; max-width: 900px; max-height: 900px;
    top: -18vw; right: -12vw;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.10), transparent 65%);
  }
  body::after {
    width: 55vw; height: 55vw; max-width: 820px; max-height: 820px;
    bottom: -20vw; left: -14vw;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.07), transparent 65%);
  }

  ::selection { background: rgba(124, 58, 237, 0.45); color: #fff; }

  a { color: var(--cyan); }
  a:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .skip-link {
    position: absolute; left: -999px; top: 0; z-index: 100;
    background: var(--violet); color: #fff;
    padding: 0.5rem 1rem; border-radius: 0 0 10px 0; text-decoration: none;
  }
  .skip-link:focus { left: 0; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ============================================================
     Grille bento
     ============================================================ */
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.5rem) clamp(1rem, 3vw, 2rem) 3rem;
  }

  .loading {
    color: var(--text-2);
    font-family: ui-monospace, monospace;
    padding: 2rem 0;
  }

  /* ============================================================
     Commutateur de langue (pill segmentée FR | EN)
     ============================================================ */
  .lang-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .lang-switch {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .lang-switch button {
    font-family: var(--font);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-3);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0.28rem 0.72rem;
    cursor: pointer;
    transition: color 0.2s ease, background-color 0.2s ease;
  }
  .lang-switch button:hover { color: var(--text-2); }
  .lang-switch button[aria-pressed="true"] {
    color: var(--text);
    background: rgba(255, 255, 255, 0.10);
    cursor: default;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
  }

  .contents { display: contents; }

  .tile {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    padding: clamp(1.15rem, 2.5vw, 1.6rem);
    transition: border-color 0.25s ease, transform 0.25s ease;
    min-width: 0;
  }
  .tile:hover {
    border-color: var(--card-border-hover);
    transform: translateY(-2px);
  }

  /* Glow radial suivant la souris (variables --mx / --my posées en JS) */
  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
    background: radial-gradient(
      460px circle at var(--mx, 50%) var(--my, 50%),
      rgba(124, 58, 237, 0.10),
      rgba(34, 211, 238, 0.04) 45%,
      transparent 65%
    );
  }
  .tile:hover::after { opacity: 1; }

  /* Placement des tuiles */
  .t-hero    { grid-column: span 8; grid-row: span var(--hero-rows, 3); }
  .t-stat    { grid-column: span 4; display: flex; flex-direction: column; justify-content: center; }
  .t-about   { grid-column: span 7; }
  .t-skills  { grid-column: span 5; }
  .t-exp     { grid-column: span 12; }
  .t-project { grid-column: span 4; display: flex; flex-direction: column; }
  .t-contact { grid-column: span 12; }

  @media (max-width: 980px) {
    .grid { grid-template-columns: repeat(6, 1fr); }
    .t-hero    { grid-column: span 6; grid-row: auto; }
    .t-stat    { grid-column: span 2; }
    .t-about,
    .t-skills,
    .t-exp,
    .t-contact { grid-column: span 6; }
    .t-project { grid-column: span 3; }
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .t-hero, .t-stat, .t-about, .t-skills,
    .t-exp, .t-project, .t-contact { grid-column: span 1; }
  }

  /* ============================================================
     Tuile hero
     ============================================================ */
  .t-hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.9rem;
    padding: clamp(1.6rem, 4vw, 2.6rem);
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(124, 58, 237, 0.10), transparent 55%),
      var(--card-bg);
  }

  .badge-dispo {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    align-self: flex-start;
    font-size: 0.8rem;
    font-weight: 500;
    color: #a7e8cd;
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-radius: 999px;
    padding: 0.32rem 0.85rem;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    position: relative;
    flex: none;
  }
  .dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(52, 211, 153, 0.7);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .hero-name {
    margin: 0;
    font-size: clamp(1.9rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .hero-title {
    margin: 0;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 600;
    background: linear-gradient(90deg, #a78bfa, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero-tagline {
    margin: 0;
    max-width: 34em;
    color: var(--text-2);
    font-size: clamp(0.95rem, 2vw, 1.05rem);
  }
  .hero-meta {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.75rem 1.25rem; margin-top: 0.35rem;
  }
  .hero-loc {
    display: inline-flex; align-items: center; gap: 0.4rem;
    color: var(--text-2); font-size: 0.88rem;
  }
  .hero-loc svg { flex: none; opacity: 0.75; }

  /* ============================================================
     Tuiles stats
     ============================================================ */
  .stat-num {
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    background: linear-gradient(135deg, #ececf1 40%, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-label {
    color: var(--text-2);
    font-size: 0.82rem;
    font-weight: 500;
    margin-top: 0.3rem;
  }

  @media (max-width: 640px) {
    .t-stat {
      flex-direction: row;
      align-items: baseline;
      gap: 0.7rem;
    }
    .stat-label { margin-top: 0; }
  }

  /* ============================================================
     Titres de tuiles & chips
     ============================================================ */
  .tile-heading {
    margin: 0 0 1rem;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .tile-heading::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.10), transparent);
  }

  .chips {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 0.45rem;
  }
  .chip {
    font-size: 0.76rem; font-weight: 500; color: #b9b9c6;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 999px; padding: 0.22rem 0.7rem; white-space: nowrap;
  }

  /* ============================================================
     Contenu markdown injecté
     ============================================================ */
  .prose { color: var(--text-2); font-size: 0.94rem; }
  .prose p { margin: 0 0 0.85em; }
  .prose p:last-child, .prose ul:last-child, .prose ol:last-child { margin-bottom: 0; }
  .prose ul, .prose ol { margin: 0 0 0.85em; padding-left: 1.25em; }
  .prose li { margin-bottom: 0.35em; }
  .prose li::marker { color: var(--violet); }
  .prose strong { color: var(--text); font-weight: 600; }
  .prose a { color: var(--cyan); text-decoration-color: rgba(34, 211, 238, 0.4); }
  .prose a:hover { text-decoration-color: var(--cyan); }
  .prose code {
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 5px;
    padding: 0.1em 0.35em;
  }
  .prose pre {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    overflow-x: auto;
  }
  .prose pre code { background: none; border: 0; padding: 0; }
  .prose h1, .prose h2, .prose h3, .prose h4 {
    color: var(--text);
    margin: 1.1em 0 0.45em;
    line-height: 1.3;
  }
  .prose blockquote {
    margin: 0 0 0.85em;
    padding: 0.1rem 0 0.1rem 1rem;
    border-left: 2px solid var(--violet);
    color: var(--text-2);
  }
  .prose hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.09); margin: 1.2em 0; }
  .prose img { max-width: 100%; border-radius: 10px; }

  /* ============================================================
     Timeline des expériences
     ============================================================ */
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0.25rem 0 0;
    position: relative;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: linear-gradient(180deg, rgba(124, 58, 237, 0.55), rgba(34, 211, 238, 0.20));
  }
  .timeline > li {
    position: relative;
    padding: 0 0 1.9rem 1.7rem;
  }
  .timeline > li:last-child { padding-bottom: 0.25rem; }
  .timeline > li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 7px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--violet);
    box-shadow: 0 0 10px rgba(124, 58, 237, 0.45);
  }

  .exp-period {
    display: inline-block; margin-bottom: 0.25rem;
    font-size: 0.76rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: #a78bfa;
  }
  .exp-head {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 0.25rem 0.6rem; margin-bottom: 0.5rem;
  }
  .exp-title { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .exp-org { color: var(--text-2); font-size: 0.9rem; }
  .exp-org::before { content: '— '; color: var(--text-3); }
  .exp-loc { color: var(--text-3); font-size: 0.82rem; }
  .timeline .chips { margin: 0.6rem 0 0.75rem; }

  /* ============================================================
     Tuiles projets
     ============================================================ */
  .proj-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 0.75rem; margin-bottom: 0.15rem;
  }
  .proj-title { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .proj-period { display: block; color: var(--text-3); font-size: 0.78rem; margin-bottom: 0.6rem; }
  .proj-summary { margin: 0 0 0.9rem; color: var(--text-2); font-size: 0.9rem; flex: 1; }

  .status {
    display: inline-flex; align-items: center; gap: 0.4rem; flex: none;
    font-size: 0.72rem; font-weight: 600;
    border-radius: 999px; padding: 0.22rem 0.65rem; white-space: nowrap;
  }
  .status::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }
  .status--actif   { color: var(--green);  background: rgba(52, 211, 153, 0.09);  border: 1px solid rgba(52, 211, 153, 0.28); }
  .status--pause   { color: var(--amber);  background: rgba(251, 191, 36, 0.09);  border: 1px solid rgba(251, 191, 36, 0.28); }
  .status--archive { color: var(--text-2); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.14); }

  .proj-details { margin: 0 0 0.9rem; }
  .proj-details summary {
    cursor: pointer; user-select: none; list-style: none;
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.8rem; font-weight: 500; color: var(--text-3);
  }
  .proj-details summary::-webkit-details-marker { display: none; }
  .proj-details summary::before {
    content: '';
    width: 0; height: 0;
    border-left: 5px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.2s ease;
  }
  .proj-details[open] summary::before { transform: rotate(90deg); }
  .proj-details summary:hover { color: var(--text-2); }
  .proj-details .prose { margin-top: 0.6rem; font-size: 0.88rem; }

  .proj-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: auto;
  }
  .t-project .chips { margin-bottom: 0.9rem; }

  /* Boutons fantômes */
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-size: 0.82rem; font-weight: 600; color: var(--text); text-decoration: none;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px; padding: 0.42rem 0.95rem;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }
  .btn-ghost:hover {
    border-color: rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.05);
  }
  .btn-ghost svg { flex: none; opacity: 0.8; }
  .btn-ghost--accent { border-color: rgba(124, 58, 237, 0.55); }
  .btn-ghost--accent:hover {
    border-color: #a78bfa;
    background: rgba(124, 58, 237, 0.12);
  }

  /* ============================================================
     Tuile contact / footer
     ============================================================ */
  .t-contact {
    text-align: center;
    padding: clamp(1.8rem, 4vw, 2.8rem);
    background:
      radial-gradient(90% 130% at 50% 110%, rgba(34, 211, 238, 0.07), transparent 60%),
      var(--card-bg);
  }
  .contact-title {
    margin: 0 0 0.4rem;
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 800; letter-spacing: -0.02em;
  }
  .contact-sub { margin: 0 auto 1.4rem; max-width: 40em; color: var(--text-2); font-size: 0.95rem; }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
  .footer-note { margin: 1.8rem 0 0; color: var(--text-3); font-size: 0.78rem; }

  /* ============================================================
     Mouvement réduit
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .tile:hover { transform: none; }
    .tile::after { display: none; }
  }
</style>
</head>

<script>
'use strict';

/* ---------- libellés d'interface FR / EN ---------- */
const L = {
  fr: {
    docTitle: 'Portfolio — Développeur freelance',
    skip: 'Aller au contenu',
    loading: 'Chargement du contenu…',
    notFound: 'Contenu introuvable — lancez ./serve.sh depuis la racine du dépôt (voir README).',
    loadError: 'Erreur de chargement du contenu : ',
    heroAria: 'Présentation',
    contactMe: 'Me contacter',
    statYears: "Années d'expérience",
    statProjects: 'Projets personnels',
    statMissions: 'Missions réalisées',
    statsAria: 'Quelques chiffres',
    about: 'À propos',
    skills: 'Compétences',
    skillsAria: 'Compétences techniques',
    experiences: 'Expériences',
    techAria: 'Technologies',
    projectFallback: 'Projet',
    readMore: 'En savoir plus',
    sourceCode: 'Code source',
    viewSite: 'Voir le site',
    projects: 'Projets',
    contactAria: 'Contact',
    contactTitle: 'Travaillons ensemble',
    contactSub: 'Une mission, un produit à construire ou simplement une question ? Écrivez-moi, je réponds vite.',
    footerNote: 'Site statique, sans framework.',
    devFallback: 'développeur',

  },
  en: {
    docTitle: 'Portfolio — Freelance developer',
    skip: 'Skip to content',
    loading: 'Loading content…',
    notFound: 'Content not found — run ./serve.sh from the repository root (see README).',
    loadError: 'Failed to load content: ',
    heroAria: 'Introduction',

    statYears: 'Years of experience',
    statProjects: 'Personal projects',
    statMissions: 'Missions completed',
    statsAria: 'Key figures',
    about: 'About',
    skills: 'Skills',
    skillsAria: 'Technical skills',
    experiences: 'Experience',
    techAria: 'Technologies',
    projectFallback: 'Project',
    readMore: 'Read more',
    sourceCode: 'Source code',
    viewSite: 'View site',
    projects: 'Projects',
    contactAria: 'Contact',
    contactTitle: "Let's work together",
    contactSub: 'A mission, a product to build or simply a question? Write to me, I reply quickly.',
    footerNote: 'Static site, no framework.',
    devFallback: 'developer',
    langAria: 'Language selection'
  }
};
let t = L.fr; /* réassigné par initSite(data, lang) */

/* ---------- petits utilitaires DOM ---------- */
function el(tag, cls, children) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (children != null) {
    for (const child of [].concat(children)) {
      if (child == null) continue;
      node.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
  }
  return node;
}

function svgIcon(pathD, size) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size || 14);
  svg.setAttribute('height', size || 14);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', pathD);
  svg.appendChild(path);
  return svg;
}

const ICONS = {
  pin: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z',
  mail: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M22 6l-10 7L2 6',
  code: 'M16 18l6-6-6-6 M8 6l-6 6 6 6',
  external: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3'
};

function chipList(tags, labelledFrom) {
  if (!Array.isArray(tags) || tags.length === 0) return null;
  const ul = el('ul', 'chips');
  if (labelledFrom) ul.setAttribute('aria-label', labelledFrom);
  for (const tag of tags) ul.appendChild(el('li', 'chip', tag));
  return ul;
}

function proseFrom(html) {
  if (!html || !html.trim()) return null;
  const div = el('div', 'prose');
  div.innerHTML = html; /* HTML pré-rendu par shared/portfolio.js */
  return div;
}

/* ---------- tuiles ---------- */
function buildHero(meta) {
  const hero = el('section', 'tile t-hero');
  hero.setAttribute('aria-label', t.heroAria);

  if (meta.availability) {
    const badge = el('p', 'badge-dispo', [el('span', 'dot'), meta.availability]);
    hero.appendChild(badge);
  }
  if (meta.name) hero.appendChild(el('h1', 'hero-name', meta.name));
  if (meta.title) hero.appendChild(el('p', 'hero-title', meta.title));
  if (meta.tagline) hero.appendChild(el('p', 'hero-tagline', meta.tagline));

  const metaRow = el('div', 'hero-meta');
  if (meta.location) {
    metaRow.appendChild(el('span', 'hero-loc', [svgIcon(ICONS.pin), meta.location]));
  }
  if (meta.email) {
    const cta = el('a', 'btn-ghost btn-ghost--accent', [svgIcon(ICONS.mail), t.contactMe]);
    cta.href = 'mailto:' + meta.email;
    metaRow.appendChild(cta);
  }
  if (metaRow.childNodes.length) hero.appendChild(metaRow);
  return hero;
}

function buildStats(data) {
  const stats = [];
  const years = data.profile.meta.years;
  if (years) stats.push({ num: years, label: t.statYears });
  if (data.projects.length) stats.push({ num: data.projects.length, label: t.statProjects });
  if (data.experiences.length) stats.push({ num: data.experiences.length, label: t.statMissions });

  const group = el('div', 'contents');
  group.setAttribute('role', 'list');
  group.setAttribute('aria-label', t.statsAria);
  for (const stat of stats) {
    const tile = el('div', 'tile t-stat', [
      el('span', 'stat-num', stat.num),
      el('span', 'stat-label', stat.label)
    ]);
    tile.setAttribute('role', 'listitem');
    group.appendChild(tile);
  }
  return { group, count: stats.length };
}

function buildAbout(profile) {
  const section = el('section', 'tile t-about');
  section.setAttribute('aria-labelledby', 'h-about');
  const heading = el('h2', 'tile-heading', t.about);
  heading.id = 'h-about';
  section.appendChild(heading);
  section.appendChild(proseFrom(profile.html) || el('p', 'prose', '—'));
  return section;
}

function buildSkills(meta) {
  const skills = Array.isArray(meta.skills) ? meta.skills : [];
  if (!skills.length) return null;
  const section = el('section', 'tile t-skills');
  section.setAttribute('aria-labelledby', 'h-skills');
  const heading = el('h2', 'tile-heading', t.skills);
  heading.id = 'h-skills';
  section.appendChild(heading);
  section.appendChild(chipList(skills, t.skillsAria));
  return section;
}

function buildExperiences(experiences) {
  if (!experiences.length) return null;
  const section = el('section', 'tile t-exp');
  section.setAttribute('aria-labelledby', 'h-exp');
  const heading = el('h2', 'tile-heading', t.experiences);
  heading.id = 'h-exp';
  section.appendChild(heading);

  const list = el('ol', 'timeline');
  for (const exp of experiences) {
    const item = el('li');
    const meta = exp.meta;

    if (meta.period) item.appendChild(el('time', 'exp-period', meta.period));

    const head = el('div', 'exp-head');
    if (meta.title) head.appendChild(el('h3', 'exp-title', meta.title));
    if (meta.org) head.appendChild(el('span', 'exp-org', meta.org));
    if (meta.location) head.appendChild(el('span', 'exp-loc', meta.location));
    if (head.childNodes.length) item.appendChild(head);

    const chips = chipList(meta.tags, t.techAria);
    if (chips) item.appendChild(chips);

    const body = proseFrom(exp.html);
    if (body) item.appendChild(body);
    else if (meta.summary) item.appendChild(el('p', 'prose', meta.summary));

    list.appendChild(item);
  }
  section.appendChild(list);
  return section;
}

function statusPill(status) {
  if (!status) return null;
  /* meta.status peut être en FR ou en EN : détection par sous-chaîne,
     insensible à la casse ('actif'/'active', 'en pause'/'paused', …). */
  const value = String(status).trim().toLowerCase();
  let cls = 'status--archive';
  if (value.indexOf('acti') !== -1) cls = 'status--actif';
  else if (value.indexOf('pause') !== -1) cls = 'status--pause';
  return el('span', 'status ' + cls, status);
}

function buildProjectTile(project) {
  const meta = project.meta;
  const article = el('article', 'tile t-project');

  const head = el('div', 'proj-head');
  head.appendChild(el('h3', 'proj-title', meta.title || t.projectFallback));
  const pill = statusPill(meta.status);
  if (pill) head.appendChild(pill);
  article.appendChild(head);

  if (meta.period) article.appendChild(el('time', 'proj-period', meta.period));

  const chips = chipList(meta.tags, t.techAria);
  if (chips) article.appendChild(chips);

  if (meta.summary) article.appendChild(el('p', 'proj-summary', meta.summary));

  if (project.html && project.html.trim()) {
    const details = el('details', 'proj-details');
    details.appendChild(el('summary', null, t.readMore));
    details.appendChild(proseFrom(project.html));
    article.appendChild(details);
  }

  const links = el('div', 'proj-links');
  if (meta.repo) {
    const a = el('a', 'btn-ghost', [svgIcon(ICONS.code), t.sourceCode]);
    a.href = meta.repo;
    a.target = '_blank';
    a.rel = 'noopener';
    links.appendChild(a);
  }
  if (meta.link) {
    const a = el('a', 'btn-ghost', [svgIcon(ICONS.external), t.viewSite]);
    a.href = meta.link;
    a.target = '_blank';
    a.rel = 'noopener';
    links.appendChild(a);
  }
  if (links.childNodes.length) article.appendChild(links);
  return article;
}

function buildProjects(projects) {
  if (!projects.length) return null;
  const group = el('section', 'contents');
  group.setAttribute('aria-labelledby', 'h-projects');
  const hidden = el('h2', 'visually-hidden', t.projects);
  hidden.id = 'h-projects';
  group.appendChild(hidden);
  for (const project of projects) group.appendChild(buildProjectTile(project));
  return group;
}

function buildContact(meta) {
  const footer = el('footer', 'tile t-contact');
  footer.setAttribute('aria-label', t.contactAria);

  footer.appendChild(el('h2', 'contact-title', t.contactTitle));
  footer.appendChild(el('p', 'contact-sub', t.contactSub));

  const links = el('div', 'contact-links');
  if (meta.email) {
    const a = el('a', 'btn-ghost btn-ghost--accent', [svgIcon(ICONS.mail), meta.email]);
    a.href = 'mailto:' + meta.email;
    links.appendChild(a);
  }
  if (meta.github) {
    const a = el('a', 'btn-ghost', [svgIcon(ICONS.code), 'GitHub']);
    a.href = meta.github;
    a.target = '_blank';
    a.rel = 'noopener';
    links.appendChild(a);
  }
  if (meta.linkedin) {
    const a = el('a', 'btn-ghost', [svgIcon(ICONS.external), 'LinkedIn']);
    a.href = meta.linkedin;
    a.target = '_blank';
    a.rel = 'noopener';
    links.appendChild(a);
  }
  if (links.childNodes.length) footer.appendChild(links);

  const year = new Date().getFullYear();
  const note = meta.name
    ? '© ' + year + ' ' + meta.name + ' — ' + t.footerNote
    : '© ' + year + ' — ' + t.footerNote;
  footer.appendChild(el('p', 'footer-note', note));
  return footer;
}

/* ---------- commutateur de langue ---------- */
function buildLangSwitch(lang) {
  const bar = el('div', 'lang-bar');
  const group = el('div', 'lang-switch');
  group.setAttribute('role', 'group');
  group.setAttribute('aria-label', t.langAria);

  for (const code of ['fr', 'en']) {
    const btn = el('button', null, code.toUpperCase());
    btn.type = 'button';
    btn.lang = code;
    btn.setAttribute('aria-label', code === 'fr' ? 'Français' : 'English');
    btn.setAttribute('aria-pressed', String(code === lang));
    if (code !== lang) {
      btn.addEventListener('click', () => {
        window.PortfolioShared.setLang(code);
        /* si ?lang= est présent dans l'URL, il primerait sur localStorage
           au rechargement : on l'aligne avant de recharger. */
        try {
          const url = new URL(window.location.href);
          if (url.searchParams.has('lang')) {
            url.searchParams.set('lang', code);
            window.location.href = url.href;
            return;
          }
        } catch (e) {}
        window.location.reload();
      });
    }
    group.appendChild(btn);
  }
  bar.appendChild(group);
  return bar;
}

/* ---------- glow souris (désactivé en reduced-motion) ---------- */
function attachMouseGlow(grid) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  grid.addEventListener('pointermove', (event) => {
    const tile = event.target.closest('.tile');
    if (!tile) return;
    const rect = tile.getBoundingClientRect();
    tile.style.setProperty('--mx', (event.clientX - rect.left) + 'px');
    tile.style.setProperty('--my', (event.clientY - rect.top) + 'px');
  });
}

/* ---------- assemblage ---------- */
function initSite(data, lang) {
  t = L[lang] || L.fr;
  const profileMeta = data.profile.meta;

  const skip = document.querySelector('.skip-link');
  if (skip) skip.textContent = t.skip;

  if (profileMeta.name) {
    document.title = profileMeta.name + (profileMeta.title ? ' — ' + profileMeta.title : '');
    const desc = document.querySelector('meta[name="description"]');
    if (desc && profileMeta.tagline) {
      desc.setAttribute('content',
        profileMeta.name + ', ' + (profileMeta.title || t.devFallback) + '. ' + profileMeta.tagline);
    }
  } else {
    document.title = t.docTitle;
  }

  const app = document.getElementById('app');
  app.textContent = '';

  app.appendChild(buildLangSwitch(lang));

  const grid = el('div', 'grid');

  const hero = buildHero(profileMeta);
  grid.appendChild(hero);

  const stats = buildStats(data);
  if (stats.count > 0) {
    hero.style.setProperty('--hero-rows', String(stats.count));
    grid.appendChild(stats.group);
  } else {
    hero.style.gridColumn = '1 / -1';
  }

  grid.appendChild(buildAbout(data.profile));

  const skills = buildSkills(profileMeta);
  if (skills) grid.appendChild(skills);

  const experiences = buildExperiences(data.experiences);
  if (experiences) grid.appendChild(experiences);

  const projects = buildProjects(data.projects);
  if (projects) grid.appendChild(projects);

  grid.appendChild(buildContact(profileMeta));

  app.appendChild(grid);
  attachMouseGlow(grid);
}
</script>

<script>
(async () => {
  /* Estimation de la langue avant même le chargement du moteur partagé,
     pour traduire les textes de chargement / d'erreur (même logique que
     PortfolioShared.getLang : ?lang= puis localStorage, défaut fr). */
  let earlyLang = 'fr';
  try {
    const q = new URLSearchParams(window.location.search).get('lang');
    if (q && /^[a-z]{2}$/.test(q)) earlyLang = q;
    else earlyLang = window.localStorage.getItem('portfolio-lang') || 'fr';
  } catch (e) {}
  t = L[earlyLang] || L.fr;
  document.documentElement.lang = L[earlyLang] ? earlyLang : 'fr';

  const loadingEl = document.querySelector('#app .loading');
  if (loadingEl) loadingEl.textContent = t.loading;
  const skip = document.querySelector('.skip-link');
  if (skip) skip.textContent = t.skip;

  let BASE = null;
  for (const b of ['./', '../../']) {
    try { const r = await fetch(b + 'content/manifest.json'); if (r.ok) { BASE = b; break; } } catch (e) {}
  }
  if (!BASE) {
    document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">' + t.notFound + '</p>';
    return;
  }
  const s = document.createElement('script');
  s.src = BASE + 'shared/portfolio.js';
  s.onload = async () => {
    const lang = window.PortfolioShared.getLang();
    document.documentElement.lang = lang;
    try {
      const data = await window.PortfolioShared.loadPortfolio(BASE, lang);
      initSite(data, lang);
    } catch (e) {
      const msg = (L[lang] || L.fr).loadError;
      document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">' + msg + e.message + '</p>';
    }
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
