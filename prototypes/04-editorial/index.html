<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Développeur freelance</title>
<meta name="description" content="Portfolio d'un développeur freelance : parcours, expériences, projets et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     04 — ÉDITORIAL / SWISS
     Fond crème, encre presque noire, un seul accent : bleu Klein.
     La typographie et les filets font tout le travail.
     ============================================================ */

  :root {
    --bg: #faf8f4;
    --ink: #141414;
    --accent: #002fa7;
    --muted: #5c5a55;
    --rule: rgba(20, 20, 20, 0.16);
    --rule-strong: rgba(20, 20, 20, 0.55);
    --tint: rgba(0, 47, 167, 0.045);
    --serif: "Fraunces", "Iowan Old Style", "Georgia", serif;
    --sans: "Inter", "Helvetica Neue", "Arial", sans-serif;
    --gutter: clamp(1.25rem, 5vw, 4rem);
    --measure: 68ch;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.65;
    font-feature-settings: "ss01" on;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 1px;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--accent);
    color: var(--bg);
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    z-index: 10;
  }
  .skip-link:focus-visible { left: 0.5rem; top: 0.5rem; }

  .wrap {
    width: min(1120px, 100% - 2 * var(--gutter));
    margin-inline: auto;
  }

  /* Apparition douce une fois le contenu chargé */
  .site { opacity: 0; transition: opacity 0.45s ease; }
  body.loaded .site { opacity: 1; }

  /* ---------- Barre supérieure ---------- */

  .topbar {
    border-bottom: 1px solid var(--rule);
  }
  .topbar .wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding-block: 1.1rem;
  }
  .brand {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .topnav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.4rem;
  }
  .topnav a {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    transition: color 0.2s ease;
  }
  .topnav a:hover { color: var(--accent); }

  /* ---------- Hero ---------- */

  .hero {
    padding-block: clamp(4rem, 12vh, 9rem) clamp(3.5rem, 10vh, 7rem);
  }
  .hero-name {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(3rem, 10vw, 7rem);
    line-height: 0.96;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .hero-name span { display: block; }
  .hero-name span + span { margin-left: clamp(0rem, 6vw, 4.5rem); }
  .hero-tagline {
    margin-top: clamp(1.5rem, 4vh, 2.5rem);
    max-width: 44ch;
    font-size: clamp(1rem, 1.6vw, 1.2rem);
    line-height: 1.55;
    color: var(--ink);
  }
  .hero-meta {
    margin-top: 1.1rem;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .hero-meta .sep { margin-inline: 0.55em; color: var(--rule-strong); }
  .hero-avail {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    margin-top: 2.4rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .hero-avail::before {
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  /* ---------- Sections numérotées ---------- */

  .sec {
    border-top: 1px solid var(--rule);
    padding-block: clamp(3.5rem, 9vh, 6.5rem);
  }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    margin-bottom: clamp(2rem, 5vh, 3.5rem);
  }
  .sec-num {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--accent);
  }
  .sec-title {
    font-family: var(--serif);
    font-weight: 560;
    font-size: clamp(1.9rem, 4.5vw, 3rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .placeholder { color: var(--muted); font-style: italic; }

  /* ---------- Corps de texte (markdown rendu) ---------- */

  .prose { max-width: var(--measure); }
  .prose p + p { margin-top: 1.1em; }
  .prose ul, .prose ol { margin-top: 1em; padding-left: 1.3em; }
  .prose li { margin-top: 0.45em; }
  .prose li::marker { color: var(--accent); }
  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-family: var(--serif);
    font-weight: 560;
    letter-spacing: -0.015em;
    line-height: 1.15;
    margin-top: 1.6em;
    margin-bottom: 0.5em;
  }
  .prose h1 { font-size: 1.7rem; }
  .prose h2 { font-size: 1.45rem; }
  .prose h3 { font-size: 1.25rem; }
  .prose h4 { font-size: 1.05rem; }
  .prose a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .prose code {
    font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
    font-size: 0.86em;
    background: rgba(20, 20, 20, 0.06);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  .prose pre {
    margin-top: 1.2em;
    padding: 1em 1.2em;
    background: rgba(20, 20, 20, 0.05);
    border-left: 2px solid var(--accent);
    overflow-x: auto;
  }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote {
    margin-top: 1.2em;
    padding-left: 1.2em;
    border-left: 2px solid var(--accent);
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1em;
  }
  .prose img { max-width: 100%; height: auto; }
  .prose hr { border: 0; border-top: 1px solid var(--rule); margin-block: 1.6em; }

  .about-aside {
    margin-top: 2.2rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* ---------- 02 — Compétences ---------- */

  .skills-line {
    font-family: var(--serif);
    font-weight: 480;
    font-size: clamp(1.3rem, 3vw, 1.9rem);
    line-height: 1.6;
    letter-spacing: -0.01em;
    max-width: 30em;
  }
  .skills-line .slash {
    color: var(--accent);
    font-weight: 300;
    margin-inline: 0.45em;
  }

  /* ---------- 03 — Expériences : table éditoriale ---------- */

  .exp-list { border-top: 1px solid var(--rule); }

  .exp { border-bottom: 1px solid var(--rule); }

  .exp summary {
    list-style: none;
    cursor: pointer;
    display: grid;
    grid-template-columns: 9.5rem minmax(0, 1fr) 13rem 1.5rem;
    gap: 0.35rem 1.5rem;
    align-items: baseline;
    padding: 1.4rem 0.75rem;
    transition: background-color 0.2s ease;
  }
  .exp summary::-webkit-details-marker { display: none; }
  .exp summary:hover { background: var(--tint); }

  .exp-period {
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .exp-title {
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  .exp-org {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 0.95rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .exp-tags {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    line-height: 1.8;
  }
  .exp-marker {
    justify-self: end;
    align-self: center;
    font-family: var(--serif);
    font-weight: 300;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--accent);
    transition: transform 0.25s ease;
  }
  .exp[open] .exp-marker { transform: rotate(45deg); }

  .exp-body {
    padding: 0.4rem 0.75rem 2rem calc(9.5rem + 1.5rem + 0.75rem);
  }
  .exp-lead {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.08rem;
    color: var(--muted);
    margin-bottom: 1.1em;
    max-width: var(--measure);
  }
  .exp-loc {
    display: block;
    margin-top: 1.4em;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- 04 — Projets : très gros titres ---------- */

  .proj { border-bottom: 1px solid var(--rule); padding-block: clamp(2rem, 5vh, 3rem); }
  .proj:first-of-type { border-top: 1px solid var(--rule); }

  .proj-title {
    font-family: var(--serif);
    font-weight: 560;
    font-size: clamp(2.1rem, 6vw, 4.25rem);
    line-height: 1.02;
    letter-spacing: -0.025em;
    transition: color 0.25s ease;
  }
  .proj-title a { text-decoration: none; }
  .proj-arrow {
    display: inline-block;
    margin-left: 0.3em;
    color: var(--accent);
    opacity: 0;
    transform: translateX(-0.4em);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .proj:hover .proj-title,
  .proj:focus-within .proj-title { color: var(--accent); }
  .proj:hover .proj-arrow,
  .proj:focus-within .proj-arrow { opacity: 1; transform: translateX(0); }

  .proj-meta {
    margin-top: 0.9rem;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 0.9rem;
  }
  .proj-status { display: inline-flex; align-items: center; gap: 0.5em; }
  .proj-status::before {
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    flex: none;
    background: var(--muted);
  }
  .proj-status[data-status="actif"] { color: var(--accent); }
  .proj-status[data-status="actif"]::before { background: var(--accent); }
  .proj-status[data-status="en-pause"]::before {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--muted);
  }

  .proj-summary {
    margin-top: 1.1rem;
    max-width: var(--measure);
  }
  .proj-body { margin-top: 1rem; font-size: 0.95rem; color: #3a3833; }
  .proj-tags {
    margin-top: 1.2rem;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .proj-links {
    margin-top: 0.9rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.6rem;
  }
  .proj-links a {
    font-size: 0.88rem;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    text-decoration-color: var(--rule-strong);
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }
  .proj-links a:hover { color: var(--accent); text-decoration-color: var(--accent); }

  /* ---------- 05 — Contact / footer plein écran ---------- */

  .contact {
    border-top: 1px solid var(--rule);
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  .contact .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-block: clamp(3.5rem, 9vh, 6.5rem) 2rem;
  }
  .contact .sec-head { margin-bottom: 0; }
  .contact-core {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: clamp(3rem, 8vh, 5rem);
  }
  .contact-big {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.8rem, 9vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.035em;
    text-wrap: balance;
    max-width: 12em;
  }
  .contact-mail {
    display: inline-block;
    margin-top: clamp(1.8rem, 5vh, 3rem);
    align-self: flex-start;
    font-size: clamp(1.15rem, 2.6vw, 1.8rem);
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 6px;
    text-decoration-color: var(--rule-strong);
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
    overflow-wrap: anywhere;
  }
  .contact-mail:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .contact-avail {
    margin-top: 1.6rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .contact-avail::before {
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .contact-foot {
    border-top: 1px solid var(--rule);
    padding-top: 1.4rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.6rem 2rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .contact-foot nav { display: flex; gap: 1.4rem; }
  .contact-foot a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: var(--rule-strong);
    transition: color 0.2s ease;
  }
  .contact-foot a:hover { color: var(--accent); }

  /* ---------- Responsive ---------- */

  @media (max-width: 860px) {
    .exp summary {
      grid-template-columns: minmax(0, 1fr) 1.5rem;
      padding-inline: 0.25rem;
    }
    .exp-period { grid-column: 1; order: -1; }
    .exp-marker { grid-row: 1 / span 2; grid-column: 2; }
    .exp-tags { text-align: left; grid-column: 1; margin-top: 0.2rem; }
    .exp-body { padding-left: 0.25rem; padding-right: 0.25rem; }
  }

  @media (max-width: 480px) {
    body { font-size: 1rem; }
    .topnav { gap: 0.25rem 0.9rem; }
    .hero-name span + span { margin-left: 0; }
  }

  /* ---------- Mouvement réduit ---------- */

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
    .proj-arrow { transform: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>

<div class="site">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#" id="brand" aria-label="Haut de page"></a>
      <nav class="topnav" aria-label="Navigation principale">
        <a href="#apropos">À propos</a>
        <a href="#experiences">Expériences</a>
        <a href="#projets">Projets</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" aria-label="Présentation">
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <p class="hero-meta" id="hero-meta"></p>
      <p class="hero-avail" id="hero-avail" hidden></p>
    </section>

    <section class="sec" id="apropos" aria-labelledby="t-apropos">
      <div class="wrap">
        <header class="sec-head">
          <span class="sec-num" aria-hidden="true">01</span>
          <h2 class="sec-title" id="t-apropos">À propos</h2>
        </header>
        <div class="prose" id="about-body"></div>
        <p class="about-aside" id="about-aside" hidden></p>
      </div>
    </section>

    <section class="sec" id="competences" aria-labelledby="t-competences">
      <div class="wrap">
        <header class="sec-head">
          <span class="sec-num" aria-hidden="true">02</span>
          <h2 class="sec-title" id="t-competences">Compétences</h2>
        </header>
        <p class="skills-line" id="skills-line"></p>
      </div>
    </section>

    <section class="sec" id="experiences" aria-labelledby="t-experiences">
      <div class="wrap">
        <header class="sec-head">
          <span class="sec-num" aria-hidden="true">03</span>
          <h2 class="sec-title" id="t-experiences">Expériences</h2>
        </header>
        <div class="exp-list" id="exp-list"></div>
      </div>
    </section>

    <section class="sec" id="projets" aria-labelledby="t-projets">
      <div class="wrap">
        <header class="sec-head">
          <span class="sec-num" aria-hidden="true">04</span>
          <h2 class="sec-title" id="t-projets">Projets</h2>
        </header>
        <div id="proj-list"></div>
      </div>
    </section>
  </main>

  <footer class="contact" id="contact" aria-labelledby="t-contact">
    <div class="wrap">
      <header class="sec-head">
        <span class="sec-num" aria-hidden="true">05</span>
        <h2 class="sec-title" id="t-contact">Contact</h2>
      </header>
      <div class="contact-core">
        <p class="contact-big">Travaillons ensemble.</p>
        <a class="contact-mail" id="contact-mail" hidden></a>
        <p class="contact-avail" id="contact-avail" hidden></p>
      </div>
      <div class="contact-foot">
        <p id="foot-meta"></p>
        <nav aria-label="Liens externes" id="foot-links"></nav>
      </div>
    </div>
  </footer>
</div>

<script>
'use strict';

/* Échappe une valeur avant insertion dans du HTML construit à la main.
   (Les corps `html` des documents sont déjà rendus par le moteur partagé.) */
function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function byDateDesc(a, b) {
  return String(b.meta.date || '').localeCompare(String(a.meta.date || ''));
}

function setText(id, text) {
  var el = document.getElementById(id);
  if (!el) return null;
  if (text) {
    el.textContent = text;
    el.hidden = false;
  } else {
    el.hidden = true;
  }
  return el;
}

/* ---------- Hero + en-tête ---------- */

function renderHero(profile) {
  var m = profile.meta || {};

  document.getElementById('brand').textContent = m.name || 'Portfolio';
  if (m.name) {
    document.title = m.name + ' — ' + (m.title || 'Portfolio');
  }
  if (m.tagline) {
    var desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', (m.name ? m.name + ', ' : '') + m.tagline);
  }

  /* Nom immense sur deux lignes : première moitié des mots / seconde moitié. */
  var nameEl = document.getElementById('hero-name');
  var words = String(m.name || '').trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) {
    var cut = Math.ceil(words.length / 2);
    nameEl.innerHTML =
      '<span>' + esc(words.slice(0, cut).join(' ')) + '</span>' +
      '<span>' + esc(words.slice(cut).join(' ')) + '</span>';
  } else {
    nameEl.textContent = words[0] || 'Portfolio';
  }

  setText('hero-tagline', m.tagline || '');

  var metaParts = [];
  if (m.title) metaParts.push(esc(m.title));
  if (m.location) metaParts.push(esc(m.location));
  if (m.years) metaParts.push(esc(m.years) + ' ans d’expérience');
  document.getElementById('hero-meta').innerHTML =
    metaParts.join('<span class="sep" aria-hidden="true">·</span>');

  setText('hero-avail', m.availability || '');
}

/* ---------- 01 — À propos ---------- */

function renderAbout(profile) {
  document.getElementById('about-body').innerHTML =
    profile.html || '<p class="placeholder">À venir.</p>';

  var m = profile.meta || {};
  var aside = [];
  if (m.location) aside.push('Basé à ' + m.location);
  if (m.availability) aside.push(m.availability.toLowerCase());
  setText('about-aside', aside.join(' — ') + (aside.length ? '.' : ''));
}

/* ---------- 02 — Compétences ---------- */

function renderSkills(profile) {
  var skills = (profile.meta && profile.meta.skills) || [];
  var line = document.getElementById('skills-line');
  if (!skills.length) {
    line.innerHTML = '<span class="placeholder">Compétences à venir.</span>';
    return;
  }
  line.innerHTML = skills.map(esc).join('<span class="slash" aria-hidden="true">/</span>');
}

/* ---------- 03 — Expériences ---------- */

function renderExperiences(experiences) {
  var list = document.getElementById('exp-list');
  if (!experiences.length) {
    list.innerHTML = '<p class="placeholder">Aucune expérience publiée pour le moment.</p>';
    return;
  }

  list.innerHTML = experiences.slice().sort(byDateDesc).map(function (exp) {
    var m = exp.meta || {};
    var tags = (m.tags || []).map(esc).join(' · ');

    var main = '<span class="exp-main">' +
      '<span class="exp-title">' + esc(m.title || 'Expérience') + '</span>' +
      (m.org ? '<span class="exp-org">' + esc(m.org) + '</span>' : '') +
      '</span>';

    var body = '';
    if (m.summary) body += '<p class="exp-lead">' + esc(m.summary) + '</p>';
    body += exp.html || '';
    if (m.location) body += '<span class="exp-loc">' + esc(m.location) + '</span>';

    return '<details class="exp">' +
      '<summary>' +
        '<span class="exp-period">' + esc(m.period || '') + '</span>' +
        main +
        '<span class="exp-tags">' + tags + '</span>' +
        '<span class="exp-marker" aria-hidden="true">+</span>' +
      '</summary>' +
      '<div class="exp-body prose">' + body + '</div>' +
    '</details>';
  }).join('');
}

/* ---------- 04 — Projets ---------- */

function renderProjects(projects) {
  var list = document.getElementById('proj-list');
  if (!projects.length) {
    list.innerHTML = '<p class="placeholder">Aucun projet publié pour le moment.</p>';
    return;
  }

  list.innerHTML = projects.slice().sort(byDateDesc).map(function (proj) {
    var m = proj.meta || {};
    var mainLink = m.link || m.repo || '';

    var titleInner = esc(m.title || 'Projet') +
      '<span class="proj-arrow" aria-hidden="true">→</span>';
    var title = mainLink
      ? '<a href="' + esc(mainLink) + '" target="_blank" rel="noopener">' + titleInner + '</a>'
      : titleInner;

    var metaBits = [];
    if (m.period) metaBits.push('<span>' + esc(m.period) + '</span>');
    if (m.status) {
      var slug = String(m.status).toLowerCase().replace(/\s+/g, '-');
      metaBits.push('<span class="proj-status" data-status="' + esc(slug) + '">' +
        esc(m.status) + '</span>');
    }

    var links = [];
    if (m.repo) {
      links.push('<a href="' + esc(m.repo) + '" target="_blank" rel="noopener">Code source</a>');
    }
    if (m.link) {
      links.push('<a href="' + esc(m.link) + '" target="_blank" rel="noopener">Voir le projet</a>');
    }

    return '<article class="proj">' +
      '<h3 class="proj-title">' + title + '</h3>' +
      (metaBits.length ? '<p class="proj-meta">' + metaBits.join('') + '</p>' : '') +
      (m.summary ? '<p class="proj-summary">' + esc(m.summary) + '</p>' : '') +
      (proj.html ? '<div class="proj-body prose">' + proj.html + '</div>' : '') +
      ((m.tags || []).length
        ? '<p class="proj-tags">' + m.tags.map(esc).join(' · ') + '</p>' : '') +
      (links.length ? '<p class="proj-links">' + links.join('') + '</p>' : '') +
    '</article>';
  }).join('');
}

/* ---------- 05 — Contact / footer ---------- */

function renderContact(profile) {
  var m = profile.meta || {};

  if (m.email) {
    var mail = document.getElementById('contact-mail');
    mail.href = 'mailto:' + m.email;
    mail.textContent = m.email;
    mail.hidden = false;
  }
  setText('contact-avail', m.availability || '');

  var metaBits = [];
  if (m.name) metaBits.push(m.name);
  if (m.location) metaBits.push(m.location);
  document.getElementById('foot-meta').textContent =
    '© ' + new Date().getFullYear() + (metaBits.length ? ' — ' + metaBits.join(', ') : '');

  var links = [];
  if (m.github) {
    links.push('<a href="' + esc(m.github) + '" target="_blank" rel="noopener">GitHub</a>');
  }
  if (m.linkedin) {
    links.push('<a href="' + esc(m.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>');
  }
  document.getElementById('foot-links').innerHTML = links.join('');
}

/* ---------- Point d'entrée ---------- */

function initSite(data) {
  renderHero(data.profile);
  renderAbout(data.profile);
  renderSkills(data.profile);
  renderExperiences(data.experiences || []);
  renderProjects(data.projects || []);
  renderContact(data.profile);
  document.body.classList.add('loaded');
}
</script>

<script>
(async () => {
  let BASE = null;
  for (const b of ['./', '../../']) {
    try { const r = await fetch(b + 'content/manifest.json'); if (r.ok) { BASE = b; break; } } catch (e) {}
  }
  if (!BASE) {
    document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">Contenu introuvable — lancez ./serve.sh depuis la racine du dépôt (voir README).</p>';
    return;
  }
  const s = document.createElement('script');
  s.src = BASE + 'shared/portfolio.js';
  s.onload = async () => {
    try {
      const data = await window.PortfolioShared.loadPortfolio(BASE);
      initSite(data);
    } catch (e) {
      document.body.innerHTML = '<p style="font-family:monospace;padding:2rem">Erreur de chargement du contenu : ' + e.message + '</p>';
    }
  };
  document.head.appendChild(s);
})();
</script>
</body>
